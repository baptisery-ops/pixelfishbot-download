
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelFishBot Downloads</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101827;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #192438;
      text-align: center;
    }
    h1 { margin-top: 0; }
    p { color: #bdc8d8; line-height: 1.5; }
    input, button, .download {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #53627a;
      background: #101827;
      color: white;
    }
    button, .download {
      display: block;
      border: 0;
      background: #35c98b;
      color: #092318;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
    .hidden { display: none; }
    small { color: #91a0b5; }
  </style>
</head>
<body>
  <main>
    <h1>🐟 PixelFishBot</h1>
    <p>Enter your download code to get the Android APK.</p>

    <form id="downloadForm">
      <input
        id="code"
        type="text"
        placeholder="Enter your download code"
        autocomplete="off"
        required
      >
      <button id="submitButton" type="submit">
        Verify Code
      </button>
    </form>

    <p id="message" role="status"></p>

    <a id="downloadLink" class="download hidden"
       href="#" target="_blank" rel="noopener">
      Download PixelFishBot APK
    </a>

    <p><small>Download links expire after 2 minutes.</small></p>
  </main>

  <script>
    const FUNCTION_URL =
      "https://zlyhvpgfqlhbxjpaupri.supabase.co/functions/v1/redeem-pixelfishbot";

    // Replace this text with your public Supabase key.
    const SUPABASE_PUBLIC_KEY = "sb_publishable_e7E45CE1nK8DNXlxX0sGOQ_wh995fdE";

    const form = document.getElementById("downloadForm");
    const codeInput = document.getElementById("code");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const downloadLink = document.getElementById("downloadLink");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      downloadLink.classList.add("hidden");
      button.disabled = true;
      button.textContent = "Checking...";

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLIC_KEY
          },
          body: JSON.stringify({
            code: codeInput.value.trim()
          })
        });

        const result = await response.json();

        if (!response.ok || !result.download_url) {
          throw new Error(
            result.error || "Could not verify your code."
          );
        }

        downloadLink.href = result.download_url;
        downloadLink.classList.remove("hidden");
        message.textContent =
          "Code accepted! Tap the button below to download.";
      } catch (error) {
        message.textContent =
          error.message || "Connection failed. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Verify Code";
      }
    });
  </script>
</body>
</html>
